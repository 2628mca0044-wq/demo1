<!DOCTYPE html>

<head>
    <title>Image Table</title>
</head>

<body>

<table border="2" width="700" height="500" cellpadding="10">

    <!-- Top Heading -->
    <tr>
        <th colspan="3">
           <img src="/images/image1.jpg" alt="" height="800" width="150">
        </th>
    </tr>

    <!-- Middle Section -->
    <tr>

        <!-- Left Column -->
        <td rowspan="2" width="150">
            Some links in list format
        </td>

        <!-- Center Column -->
        <td width="350">
            Text about the image
        </td>

        <!-- Right Column -->
        <td>
            <table border="1" width="100%" height="100%">
                <tr>
                    <td>id</td>
                    <td>Raj</td>
                </tr>

                <tr>
                    <td>pwd</td>
                    <td>***</td>
                </tr>

                <tr>
                    <td colspan="2">Submit</td>
                </tr>
            </table>
        </td>

    </tr>

    <!-- Bottom Section -->
    <tr>
        <td colspan="2" height="250">
            <img src="/images/image1.jpg" alt="" height="600" width="200">
        </td>
    </tr>

</table>

</body>
</html>
